<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLOGBO LUXURY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0e0d;color:#f5e6c8;font-family:Arial}
.header{text-align:center;padding:50px 20px}
.header h1{font-family:serif;font-size:48px;letter-spacing:8px}
.header p{letter-spacing:6px;color:#d4af37;margin-top:10px}
.product{max-width:1000px;margin:40px auto;padding:20px;text-align:center}
.price{color:#d4af37;font-size:26px;margin:20px}
.btn{background:#d4af37;color:#000;padding:16px 32px;border:none;font-weight:bold;letter-spacing:2px;width:100%;max-width:400px;margin:10px;cursor:pointer}
.btn-outline{background:transparent;color:#f5e6c8;border:1px solid #d4af37}
#sizeGuideModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;overflow:auto;padding:10px}
.modal-box{max-width:900px;margin:20px auto;background:#0f0e0d;padding:15px;border:1px solid #d4af37;position:relative}
.close{position:absolute;top:5px;right:15px;font-size:30px;color:#f5e6c8;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>OLOGBO</h1><p>L U X U R Y</p><p style="font-size:10px;color:#666;margin-top:15px">SIMPLE • UNIQUE • LUXURY</p></div>
<div class="product">
<h2 style="font-family:serif;font-size:32px">Essential Collection</h2>
<p class="price">₦45,000</p>
<p style="color:#888;margin:20px">Unisex luxury crafted in Lagos</p>
<button class="btn btn-outline" onclick="openSizeGuide()">SIZE GUIDE - VIEW CHART</button>
<button class="btn">SHOP ON WHATSAPP</button>
</div>
<div id="sizeGuideModal">
<div class="modal-box">
<span class="close" onclick="closeSizeGuide()">&times;</span>
<img src="ologbo_combined_size_guide.png" style="width:100%" alt="Size Guide">
</div>
</div>
<script>
function openSizeGuide(){document.getElementById('sizeGuideModal').style.display='block'}
function closeSizeGuide(){document.getElementById('sizeGuideModal').style.display='none'}
</script>
</body>
</html>
